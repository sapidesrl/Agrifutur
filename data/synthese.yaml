# Synthèse : une ligne par alternative de vague 1 ou 2, affichée par docs/synthese.md.
# - fiche : chemin sous docs/fiches/ ; alternative : début du titre « ### n. … » de la fiche
#   (la vague et le lien sont lus dans la fiche, jamais recopiés ici) ;
# - fermes : types concernés parmi lait, viande, grandes cultures, maraîchage, vente directe, toutes ;
# - repere : clé d'hypotheses.yaml ou de calculs.yaml, avec un libellé court ; « compare » ajoute
#   une valeur de comparaison ; la valeur d'avant-crise (février 2026) s'affiche si elle existe ;
# - retour / retour_aide : temps de retour sans aide et avec les aides accessibles (clés) ;
# - note : une phrase, sans chiffre (les chiffres viennent des clés).

- fiche: traction/tracteur-diesel.md
  alternative: Réduire le besoin de traction
  fermes: [grandes cultures]
  repere: {cle: valeur_gasoil_economise, libelle: "de gasoil économisé en passant du labour au semis direct"}
  note: "Déplace une part de la dépendance vers le glyphosate, et la destruction chimique des couverts sera interdite en 2027 pour l'éco-régime."

- fiche: energie/chauffage-mazout.md
  alternative: Chaudière à plaquettes de bois
  fermes: [toutes]
  repere: {cle: chaudiere_gain_net_an, libelle: "de gain net, entretien déduit (ferme type de la fiche)"}
  retour: chaudiere_retour_ans
  retour_aide: chaudiere_retour_green_ans
  note: "Rentable vite pour les gros consommateurs de mazout ; l'aide GREEN demande un audit préalable, à la charge de l'agriculteur, et ne couvre pas la part qui chauffe des logements."

- fiche: energie/chauffage-mazout.md
  alternative: Récupération de chaleur
  fermes: [lait]
  note: "Réduire le besoin avant de changer de chaudière ; sur une ferme laitière, voir le récupérateur sur le tank."

- fiche: energie/electricite-reseau.md
  alternative: Photovoltaïque en autoconsommation
  fermes: [toutes]
  repere: {cle: pv_ferme_gain_net_an, libelle: "de gain net (ferme type de la fiche)"}
  retour: pv_ferme_retour_ans
  retour_aide: pv_ferme_retour_cv_ans
  note: "Le temps de retour sans aide compte déjà l'aide AII ; la colonne avec aides ajoute les certificats verts. C'est l'électricité consommée sur place qui paie l'installation."

- fiche: elevage/tank-a-lait.md
  alternative: Pré-refroidisseur
  fermes: [lait]
  repere: {cle: prerefroidisseur_eur_an, libelle: "d'électricité économisée (ferme type de la fiche)"}
  retour: prerefroidisseur_retour_bas_ans
  note: "Temps de retour pour un appareil au bas de la fourchette de prix ; presque aucune aide, sauf GREEN pour un groupe de froid neuf au CO2 ou au propane, sans audit."

- fiche: elevage/tank-a-lait.md
  alternative: Récupérateur de chaleur
  fermes: [lait]
  note: "Préchauffe l'eau de lavage avec la chaleur du lait ; intéressant surtout pour les grands volumes de lait."

- fiche: energie/sechage-grains.md
  alternative: Retirer moins d'eau
  fermes: [grandes cultures, lait]
  note: "Variété plus précoce, bonne date de récolte, maïs grain humide pour l'éleveur ; déplace une part de la dépendance vers le plastique d'ensilage."

