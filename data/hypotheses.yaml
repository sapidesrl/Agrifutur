ref_mazout_habitation_l_an:
  libelle: Mazout d'un ménage wallon chauffé au mazout (chauffage et eau chaude)
  valeur: 1940
  unite: L/an
  statut: estimé
  date: 2015-11-01
  source: https://etat.environnement.wallonie.be/files/Studies/Rapport_final_Aquawal_CEHD_VF.pdf
  note: "Données wallonnes : AQUAWAL et CEHD pour le SPW (DGO3), « Étude sur les consommations résidentielles d'eau et d'énergie en Wallonie », novembre 2015, tableau 22 : ménages qui consomment du mazout (n = 754, année 2014) : moyenne 19 397 kWh, médiane 19 885 kWh, écart-type 9 084 kWh. Conversion à 10 kWh/L : environ 1 940 L/an (calculé), soit environ 1 030 à 2 850 L à un écart-type. Vérification : facture mazout moyenne 1 572,77 € (tableau 31) au prix de l'étude 0,8081 €/L → environ 1 946 L. Une maison quatre façades consomme 2,5 fois plus qu'un appartement (même enquête, fiche MEN Focus 1 de l'État de l'environnement wallon) : une grande ferme ancienne peut dépasser cette moyenne. Lu le 27/11/2026."
