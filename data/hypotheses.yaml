  note: "Vertès et al., Fourrages 223 (2015), lu le 27/11/2026 : « lorsque la fixation est active, elle peut représenter un apport d'une centaine d'unités d'azote ». Ordres de grandeur annuels : 50 à 130 kg N/ha pour les légumineuses à graines (pois, féverole), 150 à 200 kg N/ha pour le trèfle blanc dans une association bien pourvue, 300 à 500 kg N/ha pour une luzerne ou un trèfle violet très productifs. Prairie ray-grass–trèfle blanc sans engrais (INRA Quimper) : 52 à 112 kg N/ha fixés dans les parties aériennes. Pour les protéagineux, la plus grande part part avec le grain : arrière-effet de 10 à 60 kg N/ha (trèfle blanc, pois), plus de 60 (trèfle violet), 60 à 100 (luzerne) selon la fiche Protect'eau / Fourrages Mieux / UCLouvain (2018)."

