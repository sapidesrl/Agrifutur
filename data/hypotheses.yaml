# --- Références du diagnostic : énergie --------------------------------------

ref_gasoil_cereales_ha:
  libelle: Gasoil d'une céréale d'hiver, labour, de l'implantation à la récolte
  valeur: 91
  unite: L/ha/an
  statut: sourcé
  date: 2022-05-25
  source: https://www.inrae.fr/sites/default/files/bonnes_pratiques_economes_en_carburant.pdf
  note: "Données françaises : APCA (Chambres d'agriculture), « Économies de carburant en agroéquipement », 25/05/2022, p. 3 : itinéraire d'une céréale d'hiver en labour, de l'implantation à la récolte, base de 91 L/ha. Lu le 27/11/2026. Repères : Arvalis Boigneville 78 L/ha (gasoil_labour) ; Drommi et Chatzimpiros (Energy Nexus, 2026), blé en France 3,4 GJ/ha, soit environ 94 L/ha ; ferme modèle WUR sur argile (Pays-Bas, 2019) : 86 L/ha de froment, travaux tiers non compris ; normes KWIN néerlandaises : 164 L/ha pour froment et orge, travaux tiers compris (Kamp et al., 2010). La moisson pèse environ 18 à 21 L/ha (ILVO en Flandre : 18,4 L/ha ; voir aussi moisson_conso_l_ha). Repères wallons, par exploitation et non par culture : 80 L/ha pour le matériel propre des exploitations de grandes cultures en 2013, travaux par tiers non compris (SPW-DAEA, O. Miserque, « Analyse des données comptables sur le parc matériel des exploitations », septembre 2015, figure 6, https://agriculture.wallonie.be/files/20182/21897/Analyses%20donn%C3%A9es%20comptables.pdf) ; 89 L/ha de culture de vente en moyenne sur six ans (données DAEA, CRA-W, résumé dans Fiwap-Info n° 161, p. 34, https://fiwap.be/wp-content/uploads/2021/02/1903AgGWPPPDT.pdf). Ils concordent avec 91 L/ha. Aucune référence belge par culture trouvée (recherche du 27/11/2026 : Greenotec, Livre Blanc Céréales, CRA-W, IRBAB, Fiwap)."

ref_gasoil_mais_grain_ha:
  libelle: Gasoil du maïs grain hors séchage (tous travaux, travaux tiers compris)
  valeur: 160
  unite: L/ha/an
  statut: sourcé
  date: 2010-03-26
  source: https://www.rvo.nl/sites/default/files/bijlagen/Rapport%20Energiebesparing%20op%20het%20agrarische%20bedrijf%20-%2026-03-2010.pdf
  note: "Données néerlandaises : Kamp J. et al. (PPO-WUR, 26/03/2010), tableau p. 20 : maïs grain et corn-cob-mix, 160 L/ha, normes KWIN, travaux tiers compris ; séchage non compris (propane ou gaz à part). Lu le 27/11/2026. Ces normes donnent 164 L/ha au froment, presque le double de la référence française (91 L/ha) : valeur probablement haute, aucune source belge ou française par culture trouvée. Repères partiels : implantation du maïs en labour (déchaumage, ameublissement, labour, semis combiné) environ 60 L/ha (Chambre d'agriculture de la Manche, Réussir, 03/06/2008) ; en Flandre, semis 11,75 L/ha et moissonneuse 19,84 L/ha (ILVO, OFFREM)."

ref_gasoil_betterave_ha:
  libelle: Gasoil de la betterave sucrière (tous travaux, travaux tiers compris)
  valeur: 190
  unite: L/ha/an
  statut: sourcé
  date: 2010-03-26
  source: https://www.rvo.nl/sites/default/files/bijlagen/Rapport%20Energiebesparing%20op%20het%20agrarische%20bedrijf%20-%2026-03-2010.pdf
  note: "Données néerlandaises : Kamp J. et al. (PPO-WUR), « Energiebesparing op het agrarisch bedrijf », 26/03/2010, tableau 9 : 190 L/ha de gasoil pour la culture, travaux tiers compris, normes KWIN. Lu le 27/11/2026. Concorde avec Drommi et Chatzimpiros (2026) : 6,8 GJ/ha en France, soit environ 189 L/ha (calculé). Ferme modèle WUR (2019) : 100 L/ha seulement, car l'arrachage par l'entrepreneur n'y est pas compté. Postes d'entrepreneur en Flandre (ILVO, OFFREM) : semis 3,49 L/ha, arrachage 33,26 L/ha, transport 17,16 L/ha. Les mêmes normes KWIN donnent 164 L/ha au froment, contre 91 L/ha en France : la valeur peut être haute pour la Wallonie (à vérifier). Repère belge par opération : arracheuse de betteraves 49 L/ha, automotrice 53 L/ha (CRA-W, projet Efficient 20, tableau repris dans Fiwap-Info n° 161, p. 37, origine des mesures non précisée, lu le 27/11/2026)."

ref_gasoil_pdt_ha:
  libelle: Gasoil de la pomme de terre (tous travaux, moyenne 2014-2019)
  valeur: 244
