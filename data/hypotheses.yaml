  note: "Riera A., Antier C., Baret P. (UCLouvain), « Analyse des performances environnementales et économiques de différents systèmes de production bovins en Région wallonne », résumé pour le WWF Belgique, 25/09/2020, tableau 1, lu le 27/11/2026 : part constante de 22 % pour les laitières et 6 % pour les allaitantes, d'après ERM & Universiteit Gent (2011, non lu). La fiche WWF « Soja » (2021) donne 22 % (laitières) et 5 % (viandeux). Porte sur le soja, pas sur l'ensemble des correcteurs azotés (le tourteau de colza n'est pas chiffré). Le diagnostic multiplie les concentrés par vache par cette part."

