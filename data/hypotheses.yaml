  valeur: 0.40
  unite: "%"
  statut: sourcé
  date: 2026-04-01
  source: https://transportmedia.be/fr/2026/04/vehicules-a-zero-emissions-la-deduction-pour-investissement-est-operationnelle/
  note: "Loi du 12/05/2024 (art. 69/1 CIR 92), applicable aux achats depuis le 01/01/2025 (Barreau de Liège-Huy, 12/06/2025) : 40 % de la valeur d'achat déduits des bénéfices imposables, 30 % pour les autres sociétés ; déduction de base 10 %. Catégories : énergie (stockage compris), transport sans émission de CO2, environnement, numérique. Camionnettes et vélos-cargo électriques neufs à usage exclusivement professionnel : attestation du SPF Mobilité ouverte en avril 2026. Ne joue que pour un exploitant imposé sur ses bénéfices réels ; agriculteur au forfait : non vérifié. Texte du SPF Finances non lu (site inaccessible)."

ipp_taux_marginal:
  libelle: Taux marginal d'imposition d'un indépendant à l'impôt des personnes physiques
  valeur: 0.50
  unite: "%"
  statut: hypothèse
  date: 2026-11-27
