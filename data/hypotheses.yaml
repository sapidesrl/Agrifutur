# --- Engrais ----------------------------------------------------------------

ammonitrate_prix:
  libelle: Ammonitrate 33,5 %
  valeur: 567.5
  unite: €/t
  statut: sourcé
  date: 2026-11-19
  source: https://www.pleinchamp.com/les-cours/intrants/19-ammonitrate-33-5
  note: "Prix français franco (Argus, Pleinchamp, 19/11/2026), même base que la borne de février (franco distributeur). Départ usine : 535 €/t (Terre-net, 25/11/2026). Aucun prix belge de novembre 2026 lisible le 27/11/2026 (Agryco refuse les outils automatiques, Sillon belge fermé aux robots). Seul repère belge : ammonitrate 27 % (CAN) à 445 €/t départ Gand (Agryco, page non datée, consultée le 26/11/2026, relue dans un navigateur le 27/11/2026 : prix inchangé), soit environ 1,65 €/kg d'azote. Agryco ne vend pas d'ammonitrate 33,5 % en Belgique, seulement du 27 % ; son prix rendu ferme n'est visible qu'avec un compte client. Indice Statbel des prix des engrais azotés (base 2020, trimestriel) : 197,7 au 4e trimestre 2025, 241,6 au 1er trimestre 2026, 238,9 au 2e, 224,1 au 3e (https://statbel.fgov.be/fr/themes/agriculture-peche/prix-agricoles, lu le 27/11/2026). À remplacer par un prix belge sur facture."
  scenario: true
  bas: 500
  bas_note: "Février 2026, avant-crise : environ 500 €/t franco distributeur en France (D. Jouen, Réussir/La Dépêche, 9 mars 2026, https://www.reussir.fr/articles/marche-des-engrais-la-tension-accrue-au-moyen-orient-soutient-les-engrais-azotes). Gardé pour rester sur la même base que la valeur actuelle (prix français franco distributeur, hors TVA). Repères belges du début 2026, de base différente : 390 €/t pour l’azote 27 %, soit 1,44 €/kg N ou 484 €/t en 33,5 % (calculé), prix retenu pour l’analyse économique des essais 2025 du Livre Blanc Céréales (CePiCOP, GxABT, CRA-W, CARAH, « La fertilisation azotée des céréales d’hiver », 18/02/2026, diapositive 6, https://livre-blanc-cereales.be/wp-content/uploads/2026/02/4.-LB-2026-Fertilisation-Cereales.pdf ; TVA et lieu de livraison non précisés) ; 1,39 €/kg N pour le nitrate d’ammoniaque en janvier 2026, TVA comprise, vrac, départ négoce, soit 466 €/t en 33,5 % TVA comprise (calculé) (Agra-Ost, J. Wahlen, « La valeur des engrais de ferme – janvier 2026 », https://agraost.be/assets/pdf/matieres/article%20de%20presse%20la%20valeur%20des%20engrais%20de%20ferme%202026.pdf). Les deux sont sous 500 €/t : la borne française n’exagère donc pas le prix d’avant-crise. Attention, l’indice Statbel du 1er trimestre 2026 (241,6), qui comprend février, dépasse déjà celui du 3e trimestre (224,1) : une partie de la hausse est arrivée dès ce trimestre, probablement en mars (indice trimestriel, mois non détaillés). Lus le 27/11/2026."

