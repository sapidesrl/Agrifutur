# Prix et paramètres de référence. Source unique pour les fiches et les calculs.
# statut : sourcé | estimé | hypothèse | à saisir
# unite "%" : la valeur est une fraction (0.35 = 35 %).
# Après modification : python calc/couts.py
#
# Scénarios de prix : une entrée qui porte `scenario: true` varie entre trois scénarios.
#   actuel = valeur ; bas = champ `bas` s'il existe (prix d'avant-crise), sinon valeur × scenario_bas_facteur ;
#   haut = champ `haut` s'il existe, sinon valeur × scenario_haut_facteur.
#   `bas_note` / `haut_note` expliquent d'où vient une borne donnée explicitement.

# --- Scénarios ---------------------------------------------------------------

scenario_bas_facteur:
  libelle: "Scénario bas : multiplicateur des prix sans valeur d'avant-crise connue"
  valeur: 0.7
  unite: fois
  statut: hypothèse
  date: 2026-11-26
  source: ""
  note: Prix actuel − 30 %. Sert seulement quand aucun prix de février 2026 n'est connu.

scenario_haut_facteur:
  libelle: "Scénario haut : multiplicateur des prix actuels"
  valeur: 1.3
  unite: fois
  statut: hypothèse
  date: 2026-11-26
  source: ""
  note: Prix actuel + 30 %.

