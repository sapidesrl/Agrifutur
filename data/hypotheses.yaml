  note: "Tranche la plus haute de l'IPP, hors additionnels communaux. Cohérent avec l'exemple du ministre de la Mobilité : pour une camionnette électrique de 40 000 €, plus de 8 000 € d'impôt en moins pour un indépendant, 4 000 € pour une société (ISOC à 25 %). À remplacer par le taux marginal réel de l'exploitant."

