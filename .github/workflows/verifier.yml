name: Vérifier

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recalculer
        run: python calc/couts.py
      - name: Fichiers générés à jour
        run: |
          git diff --exit-code data/calculs.yaml docs/assets/diagnostic/donnees.json || {
            echo "::error::calculs.yaml ou donnees.json n'est pas à jour : lancer python calc/couts.py et committer."
            exit 1
          }
      - name: Vérifier les fiches
        run: python outils/verifier_fiches.py
      - name: "Diagnostic : moteurs Python et JavaScript identiques"
        run: python outils/tester_diagnostic.py
      - name: Construire le site
        run: zensical build --clean --strict
