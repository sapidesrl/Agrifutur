name: Vérifier

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recalculer
        run: python calc/couts.py
      - name: data/calculs.yaml à jour
        run: |
          git diff --exit-code data/calculs.yaml || {
            echo "::error file=data/calculs.yaml::calculs.yaml n'est pas à jour : lancer python calc/couts.py et committer."
            exit 1
          }
      - name: Vérifier les fiches
        run: python outils/verifier_fiches.py
      - name: Construire le site
        run: zensical build --clean --strict
